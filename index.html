
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CRUD is a simple product management app for creating, searching, updating, and deleting products.">
    <title>CRUD | Product Manager</title>
    <link rel="icon" href="images/icons8-buy-30.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Jomhuria&family=Montserrat:wght@300;400;500;600;700&family=Work+Sans:wght@200;300;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="info">
            <h1>CRUD</h1>
            <label for="ProductName" class="text">Product Name</label>
            <input type="text" id="ProductName" required maxlength="80" autocomplete="off">
            <div id="pnamealert"><p>please start with capital letter</p></div>
            <label for="ProductCategory">Product Category</label>
            <input type="text" id="ProductCategory" required maxlength="60">
            <label for="ProductPrice">Product Price</label>
            <input type="number" id="ProductPrice" min="0" step="0.01" required>
            <label for="ProductDescription">Product Description</label>
            <textarea id="ProductDescription" maxlength="500"></textarea>
            <button class="btn1" type="button">Add Product</button>
            <button class="btn2" type="button">Clear Form</button>
        </div>
    </div>
    <div class="search">
        <input type="search" placeholder="Search products by name..." id="searchInput" aria-label="Search products by name">
    </div>
    <div class="pop">
        <table>
            <thead><tr><td>ID</td><td>Product Name</td><td>Price</td><td>Category</td><td>Description</td><td>Delete</td><td>Update</td></tr></thead>
            <tbody id="tableRow"></tbody>
        </table>
    </div>
    <p>Our Team Members</p>
    <div class="parent">
        <div class="card"><img src="images/mee.jpg" alt="Khalid Azzam"><h1>Khalid Azzam</h1><h4>iOS Developer</h4></div>
        <div class="card"><img src="images/seka.jpg" alt="Mohamed Elsayed"><h1>Mohamed Elsayed</h1><h4>Front-End Developer</h4></div>
        <div class="card"><img src="images/aser.jpg" alt="Aser Ebrahim"><h1>Aser Ebrahim</h1><h4>Back-End Developer</h4></div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
